; Project layout follows WRO_Tools_UnoR3: shared headers, board-specific src,
; native tests, and tools. UNO Q support is an unofficial community platform.
[platformio]
default_envs = uno_q, r4_minima

[env:uno_q]
platform = lee-lab-skku/arduinoq@1.0.0-rc.4
board = uno_q
framework = arduino
build_src_filter = +<uno_q/*.cpp>
lib_deps =
  https://github.com/lee-lab-skku/arduino-router-bridge.git
monitor_speed = 115200

[env:r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
build_src_filter = +<r4_minima/*.cpp>
monitor_speed = 115200
upload_protocol = dfu
